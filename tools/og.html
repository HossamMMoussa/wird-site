<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- صورة المشاركة 1200×630: لقطات حقيقية من التطبيق ونصّ عربي. تُصوَّر بـ tools/build-og.py ولا تُنشر هذه الصفحة. -->
<style>
@font-face { font-family: 'Tajawal'; font-weight: 800; src: url('../docs/assets/fonts/tajawal-800.woff'); }
@font-face { font-family: 'Tajawal'; font-weight: 500; src: url('../docs/assets/fonts/tajawal-500.woff'); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Tajawal'; background: #F3EDE1; position: relative; }
.glow { position: absolute; inset: -240px -260px auto auto; width: 820px; height: 820px; border-radius: 50%; background: radial-gradient(closest-side, rgba(31, 90, 107, 0.32), transparent 72%); }
.text { position: absolute; right: 76px; top: 150px; width: 520px; }
.eyebrow { color: #8A6A36; font-weight: 500; font-size: 26px; }
h1 { margin: 10px 0 18px; font-weight: 800; font-size: 112px; line-height: 1; color: #0F3540; display: flex; align-items: center; gap: 22px; }
h1 img { width: 92px; height: 92px; border-radius: 22px; }
p { margin: 0; font-weight: 500; font-size: 30px; line-height: 1.45; color: #14303A; }
p em { font-style: normal; color: #8A6A36; }
.phones { position: absolute; left: 10px; top: 40px; width: 560px; height: 600px; }
.phone { position: absolute; border-radius: 34px; padding: 8px; background: linear-gradient(160deg, #1d3b45, #0b2229); box-shadow: 0 30px 60px -24px rgba(15, 53, 64, 0.55); }
.phone img { display: block; border-radius: 27px; width: 100%; }
.a { width: 210px; left: 20px; top: 120px; transform: rotate(-7deg); }
.b { width: 250px; left: 160px; top: 30px; z-index: 2; }
.c { width: 210px; left: 320px; top: 120px; transform: rotate(7deg); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="phones">
  <div class="phone a"><img src="../docs/assets/img/mushaf-540.webp" alt=""></div>
  <div class="phone b"><img src="../docs/assets/img/home-540.webp" alt=""></div>
  <div class="phone c"><img src="../docs/assets/img/athkar-540.webp" alt=""></div>
</div>
<div class="text">
  <div class="eyebrow">تطبيق للعبادة اليومية</div>
  <h1><img src="../docs/assets/img/mark.svg" alt="">وِرد</h1>
  <p>مواقيت وأذان، ومصحف وتفسير،<br>وأذكار وحفظ، <em>في مكانٍ واحد.</em></p>
</div>
</body>
</html>
